
name: Build QB Dragon Aim APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "Khong tim thay gradlew o thu muc goc"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QB-Dragon-Aim-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
