
name: Build QB Dragon Aim APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inspect project
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f \( -name gradlew -o -name settings.gradle.kts -o -name build.gradle.kts \)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          WRAPPER=$(find . -maxdepth 5 -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Chua co Gradle Wrapper"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QB-Dragon-Aim-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
